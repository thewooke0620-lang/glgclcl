                      }''')
          replace(p,'        view.setText(on ? "ON" : "OFF");','        view.setText("");')
          replace(p,'        icon.setBounds(0, 0, Math.round(24 * density), Math.round(16 * density));','        icon.setBounds(0, 0, Math.round(24 * density), Math.round(24 * density));')
