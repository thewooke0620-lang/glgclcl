name: Build Shorts autoplay button v8
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get official Morphe 1.46.0 source
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: 1bcd0bcedf1238e71b0bd8815da2c10df7ef5bd2
          path: morphe-patches
          persist-credentials: false
      - name: Get previous experiment
        uses: actions/checkout@v7
        with:
          repository: thewooke0620-lang/glgclcl
          ref: 20d142254baade30a764da774bed2fd436695878
          path: previous-experiment
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply previous experiment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          p = Path('previous-experiment/.github/workflows/build-shorts.yml')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'cf3edfe901ba1a47210999c728b9e5af3242fa03c52614fd3577fe22187d0023'
          s = p.read_text()
          begin = s.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = s.index("          PY\n", begin)
          lines = s[begin:end].splitlines()
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          code = '\n'.join(line[10:] for line in lines) + '\n'
          subprocess.run(['python3', '-c', code], check=True)
          PY
      - name: Apply native Shorts playback correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          root = Path('morphe-patches')
          def replace(path, old, new):
              p = root / path
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
          
          base = 'extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/spoof/'
          replace(base + 'ShortsRequestTracker.java',
              '    private ShortsRequestTracker() { }',
              '''    private ShortsRequestTracker() { }
              private static volatile boolean currentShort;
          
              public static boolean isCurrentShort() { return currentShort; }
          
              public static synchronized void recordPlayback(String videoId, String parameters, boolean openingOrPlaying) {
                  record(videoId, parameters);
                  if (videoId == null || videoId.isEmpty() || parameters == null || parameters.isEmpty()) return;
                  boolean shortRequest = parameters.startsWith("8AEB");
                  // Follow Morphe's existing active-video classification rule.
                  // Shorts background preloads must not replace the active playback context.
                  if (!shortRequest || openingOrPlaying) currentShort = shortRequest;
              }''')
          replace('extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/spoof/SpoofVideoStreamsPatch.java',
              'ShortsRequestTracker.record(videoId, parameters);',
              'ShortsRequestTracker.recordPlayback(videoId, parameters, openingOrPlaying);')
          p = root / (base + 'SpoofVideoStreamsPatch.java')
          s = p.read_text()
          s = s.replace('    public static boolean isSpoofingEnabled() {\n        return SPOOF_VIDEO_STREAMS;\n    }',
          '''    private static boolean bypassCurrentShort() {
                  return SharedYouTubeSettings.SPOOF_VIDEO_STREAMS_SKIP_SHORTS.get()
                          && ShortsRequestTracker.isCurrentShort();
              }
          
              public static boolean isSpoofingEnabled() {
                  return SPOOF_VIDEO_STREAMS && !bypassCurrentShort();
              }''')
          for name in ['fixHLSCurrentTime', 'useMediaFetchHotConfigReplacement',
                       'usePlaybackStartFeatureFlag', 'useMediaSessionFeatureFlag']:
              signature = '    public static boolean ' + name + '(boolean original) {'
              assert s.count(signature) == 1, name
              s = s.replace(signature, signature + '\n        if (bypassCurrentShort()) return original;')
          # Reel response is specifically the Shorts endpoint. It can be evaluated before
          # the active-video hook, so preserve its native value for the entire experiment.
          signature = '    public static boolean useReelItemWatchResponseFeatureFlag(boolean original) {'
          assert s.count(signature) == 1
          s = s.replace(signature, signature + '\n        if (SharedYouTubeSettings.SPOOF_VIDEO_STREAMS_SKIP_SHORTS.get()) return original;')
          s = s.replace('return SPOOF_VIDEO_STREAMS && !StreamingDataRequest.getLastSpoofedClientUseSABR();',
                        'return isSpoofingEnabled() && !StreamingDataRequest.getLastSpoofedClientUseSABR();')
          # ID-less request builders do not provide enough data for the original per-ID rule.
          s = s.replace('if (bypassShort(requestUri.getQueryParameter("id"))) return innerTubeRequestBuilder;',
          '''String requestId = requestUri.getQueryParameter("id");
                          if (bypassShort(requestId) || (requestId == null && bypassCurrentShort())) return innerTubeRequestBuilder;''')
          s = s.replace('if (bypassShort(originalUri.getQueryParameter("id"))) return originalUrlString;',
          '''String requestId = originalUri.getQueryParameter("id");
                          if (bypassShort(requestId) || (requestId == null && bypassCurrentShort())) return originalUrlString;''')
          s = s.replace('&& "ANDROID".equals(uri.getQueryParameter("c"))) return postData;',
          '''&& ("ANDROID".equals(uri.getQueryParameter("c"))
                                      || (uri.getQueryParameter("c") == null && bypassCurrentShort()))) return postData;''')
          p.write_text(s)
          replace('gradle.properties', 'version = 1.46.0-shorts-experimental.1',
                  'version = 1.46.0-shorts-experimental.2')
          print('Applied experimental v2: native Shorts playback flags and SABR')
          PY
      - name: Check v2 request classification
        shell: bash
        run: |
          cat > ShortsV2Test.java <<'JAVA'
          import app.morphe.extension.shared.spoof.ShortsRequestTracker;
          public class ShortsV2Test {
              static void check(boolean value) { if (!value) throw new AssertionError(); }
              public static void main(String[] args) {
                  ShortsRequestTracker.recordPlayback("long", "regular", false);
                  check(!ShortsRequestTracker.isCurrentShort());
                  ShortsRequestTracker.recordPlayback("preload", "8AEB", false);
                  check(!ShortsRequestTracker.isCurrentShort());
                  check(ShortsRequestTracker.isShort("preload"));
                  ShortsRequestTracker.recordPlayback("opened", "8AEB", true);
                  check(ShortsRequestTracker.isCurrentShort());
                  check(!ShortsRequestTracker.isShort("long"));
                  ShortsRequestTracker.recordPlayback("opened", "regular", false);
                  check(!ShortsRequestTracker.isCurrentShort());
                  check(!ShortsRequestTracker.isShort("opened"));
                  System.out.println("V2 classification checks passed");
              }
          }
          JAVA
          javac -d test-classes morphe-patches/extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/spoof/ShortsRequestTracker.java ShortsV2Test.java
          java -cp test-classes ShortsV2Test
      - name: Correct Shorts startup requests v3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('morphe-patches')
          def replace(path, old, new):
              p = root / path
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
          shared = 'extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/spoof/SpoofVideoStreamsPatch.java'
          replace(shared, '    private static boolean bypassCurrentShort() {',
          '''    private static volatile java.util.function.BooleanSupplier shortsUiResolver = () -> false;
          
              public static void setShortsUiResolver(java.util.function.BooleanSupplier resolver) {
                  shortsUiResolver = java.util.Objects.requireNonNull(resolver);
              }
          
              private static boolean bypassCurrentShort() {''')
          replace(shared, '                && ShortsRequestTracker.isCurrentShort();',
              '                && (ShortsRequestTracker.isCurrentShort() || shortsUiResolver.getAsBoolean());')
          for result, label in [('innerTubeRequestBuilder', 'get_watch'), ('originalUrlString', 'initplayback')]:
              replace(shared,
                  '                if (bypassShort(requestId) || (requestId == null && bypassCurrentShort())) return ' + result + ';',
                  '                if (bypassShort(requestId) || bypassCurrentShort()) {\n'
                  '                    Logger.printDebug(() -> "Shorts v3: preserving native ' + label + ' request");\n'
                  '                    return ' + result + ';\n                }')
          yt = 'extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/spoof/SpoofVideoStreamsPatch.java'
          replace(yt, '    public static void setClientOrderToUse() {',
          '''    public static void setClientOrderToUse() {
                  app.morphe.extension.shared.spoof.SpoofVideoStreamsPatch.setShortsUiResolver(
                          () -> app.morphe.extension.youtube.shared.ShortsPlayerState.isOpen()
                                  && app.morphe.extension.youtube.shared.PlayerType.getCurrent().isNoneOrHidden());''')
          replace('gradle.properties', 'version = 1.46.0-shorts-experimental.2',
                  'version = 1.46.0-shorts-experimental.3')
          print('Applied v3 native startup request bypass; playback verification pending')
          PY
      - name: Add Shorts autoplay button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('morphe-patches')
          def replace(path, old, new):
              p = root / path
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
          base = 'extensions/youtube/src/main/java/app/morphe/extension/youtube/'
          (root / base / 'patches/ShortsAutoplayButton.java').write_text('''package app.morphe.extension.youtube.patches;
          
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import java.lang.ref.WeakReference;
          import app.morphe.extension.shared.Utils;
          import app.morphe.extension.youtube.settings.Settings;
          import app.morphe.extension.youtube.shared.PlayerType;
          import app.morphe.extension.youtube.shared.ShortsPlayerState;
          
          /** Foreground Shorts auto-advance switch. No timers or synthetic swipes. */
          public final class ShortsAutoplayButton {
              private static volatile boolean enabled;
              private static WeakReference<TextView> button = new WeakReference<>(null);
          
              private ShortsAutoplayButton() {}
          
              public static void activate() {
                  enabled = true;
                  updateVisibility();
              }
          
              public static void updateVisibility() {
                  if (!enabled) return; // No UI when the Shorts autoplay patch is not selected.
                  Utils.runOnMainThread(ShortsAutoplayButton::updateOnMainThread);
              }
          
              private static int dp(Activity activity, int value) {
                  return Math.round(value * activity.getResources().getDisplayMetrics().density);
              }
          
              private static void updateOnMainThread() {
                  Activity activity = Utils.getActivity();
                  TextView existing = button.get();
                  boolean show = activity != null && !activity.isFinishing()
                          && ShortsPlayerState.isOpen() && PlayerType.getCurrent().isNoneOrHidden()
                          && !activity.isInPictureInPictureMode();
                  if (!show) {
                      if (existing != null) existing.setVisibility(View.GONE);
                      return;
                  }
                  View content = activity.findViewById(android.R.id.content);
                  if (!(content instanceof FrameLayout)) return;
                  FrameLayout root = (FrameLayout) content;
                  if (existing == null || existing.getParent() != root) {
                      if (existing != null && existing.getParent() instanceof FrameLayout) {
                          ((FrameLayout) existing.getParent()).removeView(existing);
                      }
                      TextView view = new TextView(activity);
                      view.setTextColor(Color.WHITE);
                      view.setTextSize(12);
                      view.setGravity(Gravity.CENTER);
                      view.setPadding(dp(activity, 10), 0, dp(activity, 10), 0);
                      view.setElevation(dp(activity, 32));
                      view.setClickable(true);
                      view.setFocusable(true);
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.WRAP_CONTENT, dp(activity, 48), Gravity.TOP | Gravity.RIGHT);
                      params.rightMargin = dp(activity, 12);
                      params.topMargin = dp(activity, 64);
                      root.addView(view, params);
                      button = new WeakReference<>(view);
                      view.setOnClickListener(clicked -> {
                          Settings.SHORTS_AUTOPLAY.save(!Settings.SHORTS_AUTOPLAY.get());
                          refresh(view);
                          view.announceForAccessibility(view.getContentDescription());
                      });
                      view.getViewTreeObserver().addOnGlobalLayoutListener(() -> {
                          boolean visible = ShortsPlayerState.isOpen()
                                  && PlayerType.getCurrent().isNoneOrHidden()
                                  && !activity.isInPictureInPictureMode();
                          view.setVisibility(visible ? View.VISIBLE : View.GONE);
                          WindowInsets insets = root.getRootWindowInsets();
                          int[] location = new int[2];
                          root.getLocationOnScreen(location);
                          int safeTop = insets == null ? 0 : Math.max(0, insets.getSystemWindowInsetTop() - location[1]);
                          FrameLayout.LayoutParams layout = (FrameLayout.LayoutParams) view.getLayoutParams();
                          int top = dp(activity, 64) + safeTop;
                          if (layout.topMargin != top) {
                              layout.topMargin = top;
                              view.setLayoutParams(layout);
                          }
                      });
                      existing = view;
                  }
                  refresh(existing);
                  existing.setVisibility(View.VISIBLE);
                  existing.bringToFront();
              }
          
              private static void refresh(TextView view) {
                  boolean on = Settings.SHORTS_AUTOPLAY.get();
                  view.setText(on ? "자동재생 ON" : "자동재생 OFF");
                  view.setContentDescription(on ? "쇼츠 자동 넘김 켜짐. 눌러서 끄기" : "쇼츠 자동 넘김 꺼짐. 눌러서 켜기");
                  view.setSelected(on);
                  GradientDrawable background = new GradientDrawable();
                  background.setColor(on ? 0xCC146B42 : 0xBB202020);
                  background.setCornerRadius(24 * view.getResources().getDisplayMetrics().density);
                  view.setBackground(background);
              }
          }
          ''')
          replace(base + 'patches/ShortsAutoplayPatch.java',
                  '    public static Enum<?> changeShortsRepeatBehavior(Enum<?> original) {',
                  '    public static Enum<?> changeShortsRepeatBehavior(Enum<?> original) {\n        ShortsAutoplayButton.activate();')
          replace(base + 'shared/ShortsPlayerState.kt', '                onChange(open)',
                  '                onChange(open)\n                app.morphe.extension.youtube.patches.ShortsAutoplayButton.updateVisibility()')
          replace(base + 'shared/PlayerType.kt', '                    onChange(type)',
                  '                    onChange(type)\n                    app.morphe.extension.youtube.patches.ShortsAutoplayButton.updateVisibility()')
          p = 'patches/src/main/kotlin/app/morphe/patches/youtube/layout/shortsautoplay/ShortsAutoplayPatch.kt'
          replace(p, 'import app.morphe.patches.youtube.misc.extension.sharedExtensionPatch',
                  'import app.morphe.patches.youtube.misc.extension.sharedExtensionPatch\nimport app.morphe.patches.youtube.misc.playertype.playerTypeHookPatch')
          replace(p, '        sharedExtensionPatch,', '        sharedExtensionPatch,\n        playerTypeHookPatch,')
          replace('gradle.properties', 'version = 1.46.0-shorts-experimental.3', 'version = 1.46.0-shorts-experimental.4')
          print('Added foreground Shorts autoplay switch')
          PY
      - name: Fix button initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('morphe-patches')
          def replace(path, old, new):
              p=root/path
              s=p.read_text()
              assert s.count(old)==1,(path,old)
              p.write_text(s.replace(old,new))
          base='extensions/youtube/src/main/java/app/morphe/extension/youtube/'
          replace(base+'patches/ShortsAutoplayButton.java',
              '    private static volatile boolean enabled;',
              '    public static boolean isPatchIncluded() { return false; }')
          replace(base+'patches/ShortsAutoplayButton.java',
              '        enabled = true;\n        updateVisibility();',
              '        updateVisibility();')
          replace(base+'patches/ShortsAutoplayButton.java',
              '        if (!enabled) return;',
              '        if (!isPatchIncluded()) return;')
          replace(base+'patches/PlayerTypeHookPatch.java',
              '                ShortsPlayerState.setOpen(true);',
              '''                ShortsPlayerState.setOpen(true);
                          // Wait for the newly attached Shorts layout to finish attaching.
                          if (v != null) v.post(ShortsAutoplayButton::updateVisibility);''')
          patch='patches/src/main/kotlin/app/morphe/patches/youtube/layout/shortsautoplay/ShortsAutoplayPatch.kt'
          replace(patch,'import app.morphe.util.findInstructionIndicesReversedOrThrow',
              'import app.morphe.util.setExtensionIsPatchIncluded\nimport app.morphe.util.findInstructionIndicesReversedOrThrow')
          replace(patch,'    execute {',
              '''    execute {
                  setExtensionIsPatchIncluded("Lapp/morphe/extension/youtube/patches/ShortsAutoplayButton;")''')
          replace('gradle.properties','version = 1.46.0-shorts-experimental.4','version = 1.46.0-shorts-experimental.5')
          print('v5: initialize button when Shorts view attaches, with patch inclusion guard')
          PY
      - name: Use compact toolbar toggle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('morphe-patches')
          def replace(path,old,new):
           p=root/path;s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          p='extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/ShortsAutoplayButton.java'
          replace(p,'import android.graphics.drawable.GradientDrawable;', '''import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.ColorFilter;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.Drawable;''')
          replace(p,'            view.setTextSize(12);','            view.setTextSize(9);\n            view.setCompoundDrawablePadding(dp(activity, 2));')
          replace(p,'            view.setPadding(dp(activity, 10), 0, dp(activity, 10), 0);','            view.setPadding(0, dp(activity, 7), 0, dp(activity, 5));')
          replace(p,'                    FrameLayout.LayoutParams.WRAP_CONTENT, dp(activity, 48), Gravity.TOP | Gravity.RIGHT);','                    dp(activity, 48), dp(activity, 48), Gravity.TOP | Gravity.RIGHT);')
          replace(p,'            params.rightMargin = dp(activity, 12);','            params.rightMargin = dp(activity, 104);')
          replace(p,'            params.topMargin = dp(activity, 64);','            params.topMargin = dp(activity, 4);')
          replace(p,'                int top = dp(activity, 64) + safeTop;','                int top = dp(activity, 4) + safeTop;')
          replace(p,'        view.setText(on ? "자동재생 ON" : "자동재생 OFF");','        view.setText(on ? "ON" : "OFF");')
          replace(p,'''        GradientDrawable background = new GradientDrawable();
                  background.setColor(on ? 0xCC146B42 : 0xBB202020);
                  background.setCornerRadius(24 * view.getResources().getDisplayMetrics().density);
                  view.setBackground(background);''','''        float density = view.getResources().getDisplayMetrics().density;
                  Drawable icon = new ToggleIcon(on);
                  icon.setBounds(0, 0, Math.round(24 * density), Math.round(16 * density));
                  view.setCompoundDrawables(null, icon, null, null);
                  view.setBackgroundColor(Color.TRANSPARENT);''')
          replace(p,'    private static void refresh(TextView view) {','''    /** Small white switch, matching the toolbar icons; touch target stays 48dp. */
              private static final class ToggleIcon extends Drawable {
                  private final boolean on;
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  ToggleIcon(boolean on) { this.on = on; paint.setColor(Color.WHITE); }
                  @Override public void draw(Canvas canvas) {
                      canvas.save();
                      canvas.translate(getBounds().left, getBounds().top);
                      canvas.scale(getBounds().width() / 24f, getBounds().height() / 16f);
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(1.6f);
                      canvas.drawRoundRect(1, 2, 23, 14, 6, 6, paint);
                      paint.setStyle(Paint.Style.FILL);
                      canvas.drawCircle(on ? 17 : 7, 8, 3.6f, paint);
                      canvas.restore();
                  }
                  @Override public void setAlpha(int alpha) { paint.setAlpha(alpha); invalidateSelf(); }
                  @Override public void setColorFilter(ColorFilter filter) { paint.setColorFilter(filter); invalidateSelf(); }
                  @Override public int getOpacity() { return PixelFormat.TRANSLUCENT; }
              }
          
              private static void refresh(TextView view) {''')
          replace('gradle.properties','version = 1.46.0-shorts-experimental.5','version = 1.46.0-shorts-experimental.6')
          print('v6: compact white ON/OFF icon beside search')
          PY
      - name: Use circular autoplay icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('morphe-patches')
          def replace(path,old,new):
           p=root/path;s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          p='extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/ShortsAutoplayButton.java'
          replace(p,'import android.graphics.Paint;','import android.graphics.Paint;\nimport android.graphics.Path;')
          replace(p,'            view.setTextSize(9);\n            view.setCompoundDrawablePadding(dp(activity, 2));','            view.setTextSize(0);\n            view.setIncludeFontPadding(false);\n            view.setCompoundDrawablePadding(0);')
          replace(p,'            view.setPadding(0, dp(activity, 7), 0, dp(activity, 5));','            view.setPadding(0, dp(activity, 12), 0, dp(activity, 12));')
          replace(p,'    /** Small white switch, matching the toolbar icons; touch target stays 48dp. */','    /** White autoplay icon: circular arrow and play triangle; OFF adds a slash. */')
          replace(p,'''            canvas.scale(getBounds().width() / 24f, getBounds().height() / 16f);
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(1.6f);
                      canvas.drawRoundRect(1, 2, 23, 14, 6, 6, paint);
                      paint.setStyle(Paint.Style.FILL);
                      canvas.drawCircle(on ? 17 : 7, 8, 3.6f, paint);''','''            canvas.scale(getBounds().width() / 24f, getBounds().height() / 24f);
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(1.8f);
                      paint.setStrokeCap(Paint.Cap.ROUND);
                      paint.setStrokeJoin(Paint.Join.ROUND);
                      canvas.drawArc(2, 2, 22, 22, 45, 285, false, paint);
                      // Arrowhead at the clockwise end of the circular arc.
                      Path arrow = new Path();
                      arrow.moveTo(16.5f, 6.5f);
                      arrow.lineTo(20.66f, 7);
                      arrow.lineTo(21, 2.8f);
